      - uses: actions/checkout@v6

      - uses: ./.github/actions/lifecycle-timer
        with:
          job_name: kntrl

      - name: Start kntrl
        uses: kondukto-io/kntrl-action@v1

      # OBSERVED WORKLOAD STARTS HERE    
      - name: Workload 1 - The Environment Snooper
        run: |
          echo "Simulating credential scraping..."
          # Reading the environment variables of the current running process
          cat /proc/self/environ > /dev/null
          echo "Snooping complete."
      # OBSERVED WORKLOAD ENDS HERE

      - name: Stop kntrl
        uses: kondukto-io/kntrl-action/stop@v1
        if: always()